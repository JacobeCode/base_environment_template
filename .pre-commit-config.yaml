fail_fast: false

default_install_hook_types: [pre-commit, pre-merge-commit]
default_stages: [pre-commit, pre-merge-commit]

# The rendered tree is Jinja, not valid Python/YAML/TOML — keep every
# parsing hook out of it. Individual hooks can still narrow further.
# If some common scripts are meant to be included edit this out.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
        exclude: &tree '^\{\{cookiecutter\.project_slug\}\}/'
      - id: fix-byte-order-marker
        exclude: *tree
      - id: check-json
        exclude: *tree
      - id: check-yaml
        exclude: *tree
      - id: detect-private-key
        exclude: *tree
      - id: check-case-conflict
        exclude: *tree
      - id: trailing-whitespace
        exclude: *tree
      - id: end-of-file-fixer
        exclude: *tree
      - id: mixed-line-ending
        exclude: *tree
      - id: check-added-large-files
        exclude: *tree
      - id: debug-statements
        exclude: '(^|/)\{\{cookiecutter\.project_slug\}\}/|^hooks/post_gen_project\.py$'

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.21
    hooks:
      - id: ruff-check
        types_or: [python, pyi]
        args: [--fix]
        exclude: *tree
      - id: ruff-format
        types_or: [python, pyi]
        exclude: *tree

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.9.6          # match/pin to your uv version
    hooks:
      - id: uv-lock

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: ['-x']
        exclude: *tree


  - repo: local
    hooks:
      - id: pytest-template
        name: pytest (template render + hooks testing + total coverage)
        entry: uv run pytest   # --cov=src/template_hooks / fail_under come from pyproject
        stages: [pre-commit, manual]
        language: system
        pass_filenames: false
        files: ^(src/|hooks/|cookiecutter\.json)
      - id: coverage-threshold
        name: per-file coverage floor
        entry: bash -c "uv run coverage json -q && uv run coverage-threshold"
        language: system
        pass_filenames: false
        files:  ^(src/|hooks/)
      - id: lint-rendered-output
        name: render (defaults) + check (ruff, shellcheck, etc.) - catches bugs invisible in raw-source linting
        entry: bash tools/check-render.sh
        language: system
        pass_filenames: false
        files: '^\{\{cookiecutter\.project_slug\}\}/.*\.(py|toml|sh)$'
