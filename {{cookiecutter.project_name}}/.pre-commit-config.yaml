# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
fail_fast: true

default_install_hook_types: [pre-commit, pre-merge-commit]
default_stages: [pre-commit, pre-merge-commit]

repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v5.0.0
        hooks:
        # exclude statements for hooks can be supported and added afterwards
        -   id: debug-statements
            name: debug-statements
            description: Detect debug statements such as pdb and print calls
        -   id: check-ast
            name: check-ast
            description: Verify Python files parse correctly using AST
        -   id: fix-byte-order-marker
            name: fix-byte-order-marker
            description: Remove byte order markers from files
        -   id: check-json
            name: check-json
            description: Validate JSON files
            exclude: ^(?!.*\.json$).*$  # only check .json files
        -   id: check-yaml
            name: check-yaml
            description: Validate YAML files
            exclude: ^(?!.*\.yaml$).*$  # only check .yaml files
        -   id: detect-private-key
            name: detect-private-key
            description: Detect potential private key files
        -   id: check-large-files
            name: check-large-files
            description: Detect large files added to the repository
        -   id: check-case-conflict
            name: check-case-conflict
            description: Detect files that conflict only by case
        -   id: trailing-whitespace
            name: trailing-whitespace
            description: Remove trailing whitespace from files
        -   id: end-of-file-fixer
            name: end-of-file-fixer
            description: Ensure files end with a newline
        -   id: mixed-line-ending
            name: mixed-line-ending
            description: Detect mixed line endings in files
        -   id: check-added-large-files
            name: check-added-large-files
            description: Detect large files staged for commit
    -   repo: local
        hooks:
            -   id: blacken-docs
                name: blacken-docs
                description: "Run black on documentation examples"
                entry: uv run --with blacken-docs==1.20.0 --with black==26.5.1 blacken-docs
                language: system
                types_or: [markdown, rst, tex]
    -   repo: https://github.com/astral-sh/uv-pre-commit
        # uv version
        rev: 0.11.7
        hooks:
            # uv lockfile update
            -   id: uv-lock
    -   repo: https://github.com/astral-sh/ruff-pre-commit
        rev: 0.15.16
        hooks:
            -   id: ruff-format
                types_or: [python, pyi]
                args: [--fix]
            -   id: ruff-check
                types_or: [python, pyi]
    -   repo: local
        hooks:
            -   id: pytest
                name: pytest
                entry: uv run pytest src/test 
                stages: [pre-commit, manual]
                language: system
                pass_filenames: false
                files: ^src/
            -   id: pytest-coverage-threshold
                name: pytest-coverage-threshold
                entry: uv run pytest-coverage-threshold
                stages: [pre-commit, manual]
                language: system
                pass_filenames: false
                files: ^src/
                