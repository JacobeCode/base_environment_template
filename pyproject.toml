[project]
name = "base_env_project"
version = "0.1.0"
description = "Tooling/tests for the Cookiecutter template repo (not the generated project)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "pytest-cookies>=0.7",
    "pre-commit>=4.1.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "tests"
]

[coverage-threshold]
line_coverage_min = 80
fine_line_coverage_min = 80

[tool.coverage.run]
omit = []

[tool.ruff]
line-length = 120
force-exclude = true
extend-exclude = [
    "{{ cookiecutter.project_slug }}",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
