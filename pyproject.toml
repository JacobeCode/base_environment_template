[project]
name = "base_env_project"
version = "0.1.0"
description = "Tooling/tests for the Cookiecutter template repo (not the generated project)."
readme = "README.md"
requires-python = ">=3.12"

# Not using dependency-group as it is not intended for multi-branched development
dependencies = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=9.0.3",
    "pytest-cookies>=0.7",
    "pytest-cov>=5",
    "ruff>=0.15.16",
    "pre-commit>=4.1.0",
    "coverage-threshold>=0.6.2",
    "cookiecutter>=2.7.1",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/template_hooks"]

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "--cov=src/template_hooks --cov-report=term-missing"

[tool.coverage.run]
source = ["src/template_hooks"]
branch = true
omit = []   # for further adjustments

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true

[coverage-threshold]
line_coverage_min = 70
fine_line_coverage_min = 70

[tool.ruff]
line-length = 120
force-exclude = true
extend-exclude = [
    "{{ cookiecutter.project_slug }}",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
