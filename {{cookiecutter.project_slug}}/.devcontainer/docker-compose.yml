services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:debian-12
    volumes:
      - ../..:/workspaces:cached
      - claude-config:/home/vscode/.claude       # Docker-managed; NOT a host path
    command: sleep infinity
{%- if cookiecutter.local_model != "none" %}
    depends_on:
      ollama:
        condition: service_started
      model-init:
        condition: service_completed_successfully
    environment:
      # for login persistence
      CLAUDE_CONFIG_DIR: "/home/vscode/.claude"
      # SkillSpector -> local model (service name resolves on the compose network)
      SKILLSPECTOR_PROVIDER: "openai"
      SKILLSPECTOR_MODEL: "{{cookiecutter.local_model}}"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_API_KEY: "not-needed"
      # For terminal use of the model via the ollama CLI, if installed
      OLLAMA_HOST: "ollama:11434"
{%- endif %}
{%- if cookiecutter.gpu_usage == "yes" %}
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
{%- endif %}
{%- if cookiecutter.local_model != "none" %}

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama          # persist the model across rebuilds
    environment:
     OLLAMA_KEEP_ALIVE: "-1"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: {% if cookiecutter.local_model == "qwen2.5-coder:7b" %}7g{% elif cookiecutter.local_model == "deepseek-coder-v2:16b" %}15g{% else %}12g{% endif %}
{%- if cookiecutter.gpu_usage == "yes" %}
          # ── GPU for inference too (gpu_usage=yes means THIS host has an NVIDIA GPU
          # + Container Toolkit; `dev` gets it for training, `ollama` for the model).
          # They share the card by hand: `just model-off` before training (§7.8).
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
{%- else %}
    # NOTE (gpu_usage=no): ollama runs on CPU. Render with gpu_usage=yes on a
    # machine with an NVIDIA GPU to put it on the GPU.
{%- endif %}

  # One-shot: pulls the model into the volume, then exits. Indempotent on rebuilds.
  model-init:
    image: ollama/ollama
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull {{cookiecutter.local_model}}"]
    restart: "no"
{%- endif %}

volumes:
  claude-config:
{%- if cookiecutter.local_model != "none" %}
  ollama-models:
{%- endif %}
