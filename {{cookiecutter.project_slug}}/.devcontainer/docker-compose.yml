services:
  dev:
    image: mcr.microsoft.com/devcontainers/base:debian-12
    volumes:
      - ../..:/workspaces:cached
      - claude-config:/home/vscode/.claude       # Docker-managed; NOT a host path
    command: sleep infinity
{%- if cookiecutter.local_model != "none" %}
    depends_on:
      ollama:
        condition: service_started
      model-init:
        condition: service_completed_successfully
{%- endif %}
    environment:
      # for login persistence
      CLAUDE_CONFIG_DIR: "/home/vscode/.claude"
{%- if cookiecutter.local_model != "none" %}
      # SkillSpector -> local model (service name resolves on the compose network)
      SKILLSPECTOR_PROVIDER: "openai"
      SKILLSPECTOR_MODEL: "{{cookiecutter.local_model}}"
      OPENAI_BASE_URL: "http://ollama:11434/v1"
      OPENAI_API_KEY: "not-needed"
      # For terminal use of the model via the ollama CLI, if installed
      OLLAMA_HOST: "ollama:11434"
{%- endif %}
{%- if cookiecutter.monitoring == "yes" %}
      # OTEL telemetry
      CLAUDE_CODE_ENABLE_TELEMETRY: "1"
      OTEL_METRICS_EXPORTER: "otlp"
      OTEL_LOGS_EXPORTER: "otlp"
      OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: "http://prometheus:9090/api/v1/otlp/v1/metrics"
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: "http://loki:3100/otlp/v1/logs"
      # Prometheus's OTLP receiver wants cumulative, not Claude Code's DELTA default.
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: "cumulative"
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      # Privacy gates — OFF by default (numbers only, no content).
      OTEL_LOG_USER_PROMPTS: "0"
{%- endif %}
{%- if cookiecutter.gpu_usage == "yes" %}
    deploy:
      resources:
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
{%- endif %}
{%- if cookiecutter.local_model != "none" %}

  ollama:
    image: ollama/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama          # persist the model across rebuilds
    environment:
     OLLAMA_KEEP_ALIVE: "-1"
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: {% if cookiecutter.local_model == "qwen2.5-coder:7b" %}7g{% elif cookiecutter.local_model == "deepseek-coder-v2:16b" %}15g{% else %}12g{% endif %}
{%- if cookiecutter.gpu_usage == "yes" %}
          # ── GPU for inference too (gpu_usage=yes means THIS host has an NVIDIA GPU
          # + Container Toolkit; `dev` gets it for training, `ollama` for the model).
          # They share the card by hand: `just model-off` before training (§7.8).
        reservations:
          devices:
            - { driver: nvidia, count: all, capabilities: [gpu] }
{%- else %}
    # NOTE (gpu_usage=no): ollama runs on CPU. Render with gpu_usage=yes on a
    # machine with an NVIDIA GPU to put it on the GPU.
{%- endif %}

  # One-shot: pulls the model into the volume, then exits. Indempotent on rebuilds.
  model-init:
    image: ollama/ollama
    depends_on: [ollama]
    environment:
      OLLAMA_HOST: "ollama:11434"
    entrypoint: ["/bin/sh", "-c", "ollama pull {{cookiecutter.local_model}}"]
    restart: "no"
{%- endif %}

{%- if cookiecutter.monitoring == "yes" %}
  # monitoring stack - with auto-wake-up - must be ran with just dev up --profile monitoring
  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-otlp-receiver"     # native OTLP ingest — no Collector container needed
      - "--enable-feature=otlp-deltatocumulative"   # converts DELTA metrics to cumulative for Prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro   # ro - read only sequence
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:latest                  # log store
    profiles: ["monitoring"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki                         # persistent log storage
    ports:
      - "3100:3100"                             # reachable from the host too

    grafana:
    image: grafana/grafana:latest               # the dashboard UI
    profiles: ["monitoring"]
    depends_on: [prometheus, loki]            
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"         # no login screen | anonymous access
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"      
      GF_INSTALL_PLUGINS: ""                    
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro   # datasources + dashboard loader
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro   # the dashboard JSON itself
      - grafana-data:/var/lib/grafana           # Grafana's own state (users, preferences)
    ports:
      - "3000:3000"                             
{%- endif %}

volumes:
  claude-config:
{%- if cookiecutter.local_model != "none" %}
  ollama-models:
{%- endif %}
{%- if cookiecutter.monitoring == "yes" %}
  prometheus-data:
  loki-data:
  grafana-data:
{%- endif %}