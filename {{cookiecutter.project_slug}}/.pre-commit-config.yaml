# fail_fast false to gather all errors
fail_fast: false

default_install_hook_types: [pre-commit, pre-merge-commit]
default_stages: [pre-commit, pre-merge-commit]

repos:
    -   repo: https://github.com/pre-commit/pre-commit-hooks
        rev: v6.0.0
        hooks:
            - id: debug-statements
            - id: check-ast
            - id: fix-byte-order-marker
            - id: check-json
            - id: check-yaml
            - id: end-of-file-fixer
            - id: trailing-whitespace
            - id: detect-private-key
            - id: check-added-large-files
            - id: check-case-conflict
            - id: mixed-line-editing

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.1
      hooks:
        - id: ruff-check
          types_or: [python, pyi]
          args: [--fix]
        - id: ruff-format
          types_or: [python, pyi]

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.9.6
      hooks:
        - id: uv-lock

    - repo: local
      hooks:
        - id: blacken-docs
          name: blacken-docs
          description: "Run black on Python code blocks in this project's docs"
          entry: uv run --with blacken-docs==1.20.0 --with black==26.5.1 blacken-docs
          language: system
          types_or: [markdown]
        - id: skillspector-static
          name:
          entry: skillspector scan ./skills/ --no-llm --format terminal
          language: system
          pass_filenames: false
          files: ^skills/
        - id: pytest-cov
          name: pytest + total coverage gate
          entry: uv run pytest
          language: system
          pass_filenames: false
          files: ^(src/|tests/)
        - id: coverage-threshold
          name: per-file coverage floor
          entry: bash -c "uv run coverage json -q && uv run coverage-threshold"
          language: system
          pass_filenames: false
          files: ^(src/|tests/)
