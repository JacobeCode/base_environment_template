[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "Initial project template."
authors = [{{ name = "cookiecutter.author" }}]
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = [
    "black>=26.5.1",
    "docker>=7.1.0",
    "isort>=8.0.1",
    "pycodestyle>=2.14.0",
    "pyflakes>=3.4.0",
    "pytest>=9.0.3",
    "ruff>=0.15.16",
    "pytest-cookies>=0.7",
    "pytest-cov>=5",
    "pre-commit>=4.1.0",
    "coverage-threshold>=0.6.2",
    "shellcheck-py>=0.11.0.1",
    "skillspector",
]

# training stack
{%- if cookiecutter.gpu_training == "yes" %}
train = [
    "torch",
    "torchvision",
    "torchaudio",
]
{%- endif %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{cookiecutter.project_slug}}"]

[tool.uv.sources]
skillspector = { git = "https://github.com/NVIDIA/skillspector.git" }
{%- if cookiecutter.gpu_training == "yes" %}
torch = [{ index = "pytorch-cu126" }]   # cu126 for broadly compatible option
torchvision = [{ index = "pytorch-cu126" }] # cu126 for broadly compatible option

[[tool.uv.index]]
name = "pytorch-cu126"
url = https://download.pytorch.org/whl/cu126
explicit = true
{%- endif %}

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[coverage-threshold]
line_coverage_min = 80
branch_coverage_min = 50
fine_line_coverage_min = 75

[tool.ruff]
line-length = 120
exclude = [
    "**/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
