[project]
name = "{{cookiecutter.project_slug}}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
authors = [{ name = "{{cookiecutter.author}}" }]
readme = "README.md"
requires-python = ">={{cookiecutter.python_version}}"
dependencies = [
    "skillspector",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage-threshold>=0.4.4",
    "ruff>=0.15.16",
    "pre-commit>=4.1.0",
]
{%- if cookiecutter.gpu_training == "yes" %}
train = [
    "torch",
    "torchvision",
    "torchaudio",
]
{%- endif %}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{cookiecutter.project_slug}}"]

[tool.uv.sources]
skillspector = { git = "https://github.com/NVIDIA/skillspector.git" }
{%- if cookiecutter.gpu_training == "yes" %}
torch = [{ index = "pytorch-cu126" }]   # cu126 for broadly compatible option
torchvision = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
{%- endif %}

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true

[coverage-threshold]
line_coverage_min = 80
branch_coverage_min = 50
file_line_coverage_min = 75

[tool.ruff]
line-length = 120
exclude = [
    "**/conftest.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
