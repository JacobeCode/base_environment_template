name: skill security scan
on:
  push: { paths: ['skills/**', '**/*.md'] }
  pull_request:
jobs:
  scan:
    runs-on: ubuntu-latest
    permissions: { security-events: write }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git
      - run: skillspector scan ./skills/ --no-llm --format sarif --output results.sarif
        continue-on-error: true   # for passing to JSON inspection
      - run: skillspector scan ./skills/ --no-llm --format json --output report.json
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with: { sarif_file: results.sarif }
      - name: Apply recommendation-based gate
        run: |
          rec=$(jq -r '.risk_assessment.recommendation' report.json)
          score=$(jq -r '.risk_assessment.score' report.json)
          echo "score=$score recommendation=$rec"
          case "$rec" in
            DO_NOT_INSTALL)
              echo "::error::SkillSpector: DO_NOT_INSTALL (score $score) — blocking merge"
              exit 1 ;;
            CAUTION)
              echo "::warning::SkillSpector: CAUTION (score $score) — review findings before merging" ;;
            SAFE)
              echo "SkillSpector: SAFE (score $score)" ;;
          esac